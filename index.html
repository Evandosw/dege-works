const TAGS = [...new Set(DATA.flatMap(d => d.tags))];
let activeTag = null;

const bar = document.querySelector('.bar');
TAGS.forEach(t => {
  const b = document.createElement('span');
  b.className = 'chip'; b.textContent = t;
  b.onclick = () => {
    activeTag = (activeTag === t) ? null : t;
    [...bar.querySelectorAll('.chip')].forEach(c => c.classList.toggle('on', c.textContent === activeTag));
    render();
  };
  bar.appendChild(b);
});

function match(d, kw) {
  if (activeTag && !d.tags.includes(activeTag)) return false;
  if (!kw) return true;
  kw = kw.toLowerCase();
  return (d.title + d.name + d.sub + d.text + d.tags.join('') + d.forms.join('') + d.auds.join('')).toLowerCase().includes(kw);
}

function render() {
  const kw = document.getElementById('q').value.trim();
  const list = DATA.filter(d => match(d, kw));
  document.getElementById('hint').textContent = list.length + ' / ' + DATA.length + ' 件';
  document.getElementById('grid').innerHTML = list.map(d => `
    <div class="card" data-no="${d.no}">
      <div class="thumb">${d.imgs.length ? `<img src="${d.imgs[0].src}" alt="" loading="lazy">` : ''}</div>
      <div class="card-body">
        <h3>${d.title}</h3>
        <div class="who">${d.name} · ${d.time.slice(0, 10)}</div>
        <div>${d.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <div class="meta">${d.imgs.length} 张图 · ${d.forms.slice(0, 2).join(' / ')}</div>
      </div>
    </div>`).join('');
  [...document.querySelectorAll('.card')].forEach(c => c.onclick = () => open(+c.dataset.no));
}

      </div>
      <h4>作品图片（${d.imgs.length} 张）</h4>
      <div class="gallery">${d.imgs.map((im, i) => `
        <figure><img src="${im.src}" loading="lazy" onclick="zoom(this)"><figcaption>${im.n}</figcaption></figure>`).join('')}</div>
      <h4>学生原话（原文，未改动）</h4>
      <div class="text">${d.text || '（未填写）'}</div>
    </div>`;
  document.getElementById('ov').classList.add('on');
}
function closeIt(){ document.getElementById('ov').classList.remove('on'); }
function zoom(img){
  const w = window.open(''); w.document.write(`<img src="${img.src}" style="max-width:100%">`);
}
document.getElementById('ov').onclick = e => { if (e.target.id === 'ov') closeIt(); };
document.getElementById('q').oninput = render;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeIt(); });
render();
</script>
</body>
</html>
